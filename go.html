<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공장 연결</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body style="font-family:sans-serif;background:#111;color:#eee;padding:24px;max-width:40rem">
  <p>공장 주소를 찾는 중…</p>
  <p style="color:#888;font-size:14px">1차 공장, 실패하면 깃허브.</p>
  <p id="alt" style="display:none;margin-top:16px"></p>
  <script>
  (function () {
    var books = [
      "https://wk7007-wk.github.io/bbq-dashboard/updates/endpoints.json",
      "https://gist.githubusercontent.com/wk7007-wk/a67e5de3271d6d0716b276dc6a8391cb/raw/endpoints.json"
    ];
    var PATHS = {
      posweb: "/posweb.html",
      orderhelper: "/OrderHelper/",
      hynix: "/hynix/",
      "chicken-timer": "/chicken-timer/",
      updates: "/updates/"
    };
    var GH = "https://wk7007-wk.github.io/bbq-dashboard";
    var params = new URLSearchParams(location.search);
    var to = params.get("to") || "posweb";
    var via = (params.get("via") || "auto").toLowerCase();
    params.delete("to");
    params.delete("via");
    params.delete("stay");
    var extra = params.toString();
    var path = PATHS[to] || PATHS.posweb;
    if (extra) path += (path.indexOf("?") >= 0 ? "&" : "?") + extra;

    function join(base, suffix) {
      return String(base || "").replace(/\/$/, "") + suffix;
    }
    function pageHttps() {
      return String(location.protocol || "") === "https:";
    }
    function canUse(u) {
      u = String(u || "").replace(/\/$/, "");
      if (!u || u.indexOf("http") !== 0) return false;
      if (pageHttps() && u.indexOf("http://") === 0) return false;
      if (u.indexOf("github.io") >= 0) return false;
      return true;
    }
    function withStay(url) {
      return url + (url.indexOf("?") >= 0 ? "&" : "?") + "stay=1";
    }
    function probe(base) {
      var ctrl = typeof AbortController === "function" ? new AbortController() : null;
      var t = setTimeout(function () { try { if (ctrl) ctrl.abort(); } catch (e) {} }, 2500);
      return fetch(join(base, "/health?t=" + Date.now()), {
        cache: "no-store",
        mode: "no-cors",
        signal: ctrl ? ctrl.signal : undefined
      }).then(function () {
        clearTimeout(t);
        return base;
      }).catch(function (err) {
        clearTimeout(t);
        throw err;
      });
    }
    function firstFactory(bases) {
      if (!bases.length) return Promise.reject(new Error("none"));
      return new Promise(function (resolve, reject) {
        var left = bases.length;
        var done = false;
        bases.forEach(function (base) {
          probe(base).then(function () {
            if (done) return;
            done = true;
            resolve(base);
          }).catch(function () {
            left -= 1;
            if (!done && left <= 0) reject(new Error("none"));
          });
        });
      });
    }
    function showAlt(ghUrl, factoryUrl) {
      var alt = document.getElementById("alt");
      if (!alt) return;
      var bits = [];
      if (factoryUrl) bits.push('<a href="' + factoryUrl + '" style="color:#8cf">공장 주소</a>');
      if (ghUrl) bits.push('<a href="' + withStay(ghUrl) + '" style="color:#8cf">깃허브 주소</a>');
      if (!bits.length) return;
      alt.style.display = "block";
      alt.innerHTML = "안 열리면 " + bits.join(" · ");
    }

    function run(ep) {
      var f = (ep && ep.sets && ep.sets.factory) || {};
      var primarySet = (ep && ep.sets && ep.sets.primary) || {};
      var lan = String(f.site_lan_base || "").replace(/\/$/, "");
      var wan = String(f.wan_base || "").replace(/\/$/, "");
      var gh = String(primarySet.pages_base || GH).replace(/\/$/, "");
      var ghUrl = join(gh, path);
      var factoryHttps = [];
      ["wan_https", "magic_base", "pages_base"].forEach(function (k) {
        var u = String(f[k] || "").replace(/\/$/, "");
        if (canUse(u) && factoryHttps.indexOf(u) < 0) factoryHttps.push(u);
      });
      if (via === "lan" && lan) {
        showAlt(ghUrl, wan ? join(wan, path) : "");
        location.replace(join(lan, path));
        return;
      }
      if (via === "wan" && wan) {
        showAlt(ghUrl, lan ? join(lan, path) : "");
        location.replace(join(wan, path));
        return;
      }
      if (via === "gh") {
        location.replace(withStay(ghUrl));
        return;
      }
      showAlt(ghUrl, wan ? join(wan, path) : (lan ? join(lan, path) : ""));
      firstFactory(factoryHttps).then(function (base) {
        location.replace(join(base, path));
      }).catch(function () {
        location.replace(withStay(ghUrl));
      });
    }

    function next(i) {
      if (i >= books.length) {
        location.replace(withStay(join(GH, path)));
        return;
      }
      fetch(books[i], { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("http");
        return r.json();
      }).then(run).catch(function () { next(i + 1); });
    }
    next(0);
  })();
  </script>
</body>
</html>
